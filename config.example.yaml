server:
  host: 127.0.0.1
  port: 8000
  public_base_url: http://localhost:8000

calendar:
  future_horizon_days: 90
  include_free_time: true

# Required when google or microsoft is enabled:
# env_file: secrets/providers.env
# The file may contain:
# ICS_MERGER_GOOGLE_CLIENT_ID=your-google-client-id
# ICS_MERGER_GOOGLE_CLIENT_SECRET=your-google-client-secret
# ICS_MERGER_MICROSOFT_CLIENT_ID=your-microsoft-application-client-id
# ICS_MERGER_MICROSOFT_CLIENT_SECRET=your-microsoft-client-secret

remote_ics:
  calendars: []
  # Replace the empty list with entries such as:
  # calendars:
  #   - name: Work
  #     url: https://calendar.example/work.ics
  #     ttl_seconds: 3600
  allow_private_networks: false
  max_response_bytes: 5242880
  connect_timeout_seconds: 5
  read_timeout_seconds: 10
  write_timeout_seconds: 5
  pool_timeout_seconds: 5

storage:
  token_file_path: data/tokens.json

# Omit this entire section to disable Google Calendar.
# google:
#   calendars:
#     - name: Personal
#       calendar_id: primary
#       ttl_seconds: 3600

# Omit this entire section to disable Microsoft Calendar.
# microsoft:
#   tenant: common
#   calendars:
#     - name: Company
#       calendar_id: primary
#       ttl_seconds: 3600