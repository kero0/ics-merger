<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Calendar</title>
  <link rel="stylesheet" href="/assets/app.css">
  <script src="/assets/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="Calendar home">
      <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
      <span>Calendar</span>
    </a>
    <nav class="actions" aria-label="Calendar actions">
      <button class="icon-button" id="previous" type="button" title="Previous seven days" aria-label="Previous seven days">&#8249;</button>
      <button class="today-button" id="today" type="button">Today</button>
      <button class="icon-button" id="next" type="button" title="Next seven days" aria-label="Next seven days">&#8250;</button>
      <span class="divider" aria-hidden="true"></span>
      <button class="icon-button refresh-button" id="refresh" type="button" title="Refresh calendar" aria-label="Refresh calendar">&#8635;</button>
      <a class="today-button nav-link" href="/settings">Settings</a>
      <a class="download-button" href="/api/calendars/merged.ics" download>Download ICS</a>
    </nav>
  </header>

  <main>
    <section class="summary" aria-labelledby="range-title">
      <div>
        <p class="eyebrow">Seven day outlook</p>
        <h1 id="range-title">Loading calendar</h1>
      </div>
      <div class="source-state" id="source-state" role="status">
        <span class="status-dot"></span>
        <span>Connecting</span>
      </div>
    </section>

    <section class="toolbar" aria-label="Event filters">
      <div class="segments" id="filters">
        <button class="segment active" type="button" data-filter="all" aria-pressed="true">All</button>
        <button class="segment" type="button" data-filter="busy" aria-pressed="false">Busy</button>
        <button class="segment" type="button" data-filter="tentative" aria-pressed="false">Tentative</button>
        <button class="segment" type="button" data-filter="free" aria-pressed="false">Available</button>
      </div>
      <p class="event-count" id="event-count">0 events</p>
    </section>

    <section class="calendar-shell">
      <div class="calendar" id="calendar" aria-live="polite" aria-busy="true"></div>
      <div class="empty-state" id="empty-state" hidden>
        <strong>No events in this window</strong>
        <span>Your next seven days are clear.</span>
      </div>
      <div class="error-state" id="error-state" hidden>
        <strong>Calendar unavailable</strong>
        <span id="error-message">Could not load calendar sources.</span>
        <button type="button" id="retry">Try again</button>
      </div>
    </section>
  </main>

  <dialog id="event-dialog">
    <button class="dialog-close" id="dialog-close" type="button" aria-label="Close">&#215;</button>
    <p class="dialog-kicker" id="dialog-status"></p>
    <h2 id="dialog-title"></h2>
    <dl>
      <div><dt>When</dt><dd id="dialog-time"></dd></div>
      <div id="dialog-location-row"><dt>Where</dt><dd id="dialog-location"></dd></div>
    </dl>
    <p class="dialog-description" id="dialog-description"></p>
  </dialog>
</body>
</html>
